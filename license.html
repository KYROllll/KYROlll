<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080809">
  <meta name="description" content="Your KYROlll license certificate. Download the PDF for your records.">
  <meta name="robots" content="noindex">
  <title>YOUR LICENSE — KYROlll</title>
  <link rel="icon" type="image/svg+xml" href="assets/kyrolll-metal.svg">
  <link rel="stylesheet" href="style.css?v=120">
  <script>document.documentElement.classList.add("preloader-armed");</script>
</head>
<body class="page-body">
  <div class="preloader" id="preloader" role="status" aria-label="Loading KYROlll">
    <div class="preloader__stage">
      <div class="logo-stage preloader__flower" role="img" aria-label="KYROlll custom die-cut pearl flower, rotating in three dimensions">
        <img class="logo-fallback" src="assets/kyrolll-flower-rest.png?v=1" alt="" width="1040" height="1040" fetchpriority="high">
      </div>
      <p class="preloader__name">KYROlll</p>
      <div class="preloader__progress" aria-hidden="true">
        <div class="preloader__progress-bar" id="preloader-bar"></div>
      </div>
    </div>
  </div>

  <div class="viewport">

    <header class="header">
      <a class="header-brand" href="index.html">KYROlll</a>
    </header>

    <main class="page-main" id="license-page">
      <nav class="page-nav" aria-label="License">
        <a href="index.html">← KYROlll STORE</a>
      </nav>

      <article class="notice-view notice-view--centered">
        <div class="page-notice">
          <span class="page-notice__kicker">LICENSE CERTIFICATE</span>
          <h1 class="page-notice__title" id="license-beat">KYROlll BEAT</h1>
          <p class="page-notice__text" id="license-meta">Checking your order…</p>
          <div class="page-notice__actions">
            <button class="kyrolll-btn" id="license-download" type="button">DOWNLOAD PDF LICENSE</button>
            <a class="kyrolll-btn" href="index.html#catalog">BROWSE BEATS →</a>
          </div>
          <p class="page-notice__text">Questions? Contact <a href="mailto:kyrolll00@gmail.com">kyrolll00@gmail.com</a>.</p>
        </div>
      </article>
    </main>

    <footer class="footer">
      <img class="footer__logo" src="assets/kyrolll-secondary.png" alt="KYROlll with brown X" width="1490" height="453" loading="lazy">
      <p><span class="brand-name">KYROlll</span> &copy; 2026</p>
      <a class="footer__support" href="mailto:kyrolll00@gmail.com">SUPPORT</a>
    </footer>
  </div>

  <script src="catalog.js?v=3"></script>
  <script src="assets/jspdf.min.js"></script>
  <script src="license-pdf.js?v=1"></script>
  <script>
    (function () {
      "use strict";
      var params = new URLSearchParams(window.location.search);
      var beat = window.KYROlll_HELPERS.beatById(params.get("beat") || "") || {};
      var tierId = params.get("tier") || "mp3";
      var tier = window.KYROlll_HELPERS.licenseById(tierId) || {};
      var email = params.get("email") || "";
      var numericPrice = params.get("price") || "";
      var license = {
        id: params.get("id") || "license",
        date: new Date().toLocaleDateString(),
        beatTitle: beat.title || "KYROlll BEAT",
        tier: tier.name || tierId.toUpperCase(),
        tierId: tierId,
        price: numericPrice ? "$" + numericPrice : (tier.price || "")
      };
      var meta = [license.tier, license.price, email].filter(Boolean).join(" · ");
      document.getElementById("license-beat").textContent = license.beatTitle;
      document.getElementById("license-meta").textContent = meta;
      document.getElementById("license-download").addEventListener("click", function () {
        window.KYROlll_LICENSE_PDF.download(license, { email: email });
      });
    })();
  </script>
  <script type="module" src="assets/brand-logo.min.js?v=19"></script>
  <script src="preloader.js?v=8"></script>
</body>
</html>
