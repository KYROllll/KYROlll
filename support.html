<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080809">
  <meta name="robots" content="noindex">
  <title>SUPPORT — KYROlll</title>
  <link rel="icon" type="image/svg+xml" href="assets/kyrolll-metal.svg">
  <link rel="stylesheet" href="style.css?v=118">
  <script>document.documentElement.classList.add("preloader-armed");</script>
</head>
<body class="account-body">
  <div class="preloader" id="preloader" role="status" aria-label="Loading KYROlll">
    <div class="preloader__stage">
      <div class="logo-stage preloader__flower" role="img" aria-label="KYROlll custom die-cut pearl flower, rotating in three dimensions">
        <img class="logo-fallback" src="assets/kyrolll-flower-rest.png?v=1" alt="" width="1040" height="1040" fetchpriority="high">
      </div>
      <p class="preloader__name">KYROlll</p>
      <div class="preloader__progress" aria-hidden="true"><div class="preloader__progress-bar" id="preloader-bar"></div></div>
    </div>
  </div>
  <div class="viewport">
    <header class="header"><a class="header-brand" href="index.html">KYROlll</a><div class="header-auth" id="header-auth"></div></header>
    <main class="account-page" id="support-page">
      <nav class="account-nav" aria-label="Account"><a href="index.html">← KYROlll STORE</a><div class="account-nav__links"><a href="library.html">MY LIBRARY</a><a href="dashboard.html">PROFILE</a></div></nav>
      <section class="account-panel" style="max-width:680px;margin:0 auto;">
        <header class="account-panel__head"><span class="account-panel__kicker">SUPPORT</span><h1 class="account-panel__title">WE'RE HERE TO HELP</h1><p class="account-panel__sub">Your permanent ID is included automatically.</p></header>
        <div id="support-body" class="library-empty">
          <p>Loading your identity…</p>
        </div>
      </section>
    </main>
    <footer class="footer"><img class="footer__logo" src="assets/kyrolll-secondary.png" alt="KYROlll with brown X" width="1490" height="453" loading="lazy"><p><span class="brand-name">KYROlll</span> &copy; 2026</p><a class="footer__support" href="#" id="footer-support-link">SUPPORT</a></footer>
  </div>
  <script src="supabase-config.js?v=5"></script><script src="catalog.js?v=3"></script><script src="kyrolll-backend.js?v=13"></script><script src="account.js?v=14"></script><script type="module" src="assets/brand-logo.min.js?v=18"></script><script src="preloader.js?v=7"></script>
  <script>
    (function(){
      document.addEventListener("kyrolll:auth", renderSupport);
      document.addEventListener("DOMContentLoaded", renderSupport);
      function renderSupport(){
        const body = document.getElementById("support-body");
        const link = document.getElementById("footer-support-link");
        if(!body)return;
        const b = window.KYROlll_BACKEND || null;
        const user = b ? b.auth.currentUser() : null;
        if(user && user.id){
          const bodyText = "KYROlll Support Request\n\nUser ID: " + user.id + "\nEmail: " + (user.email || "") + "\n\nIssue:";
          const mail = "mailto:kyrolll00@gmail.com?subject=KYROlll%20Support%20—%20" + encodeURIComponent(user.id) + "&body=" + encodeURIComponent(bodyText);
          body.innerHTML = '<span class="library-empty__title">READY TO REACH US</span><p>We have your account details. Send a message with your permanent ID included.</p><a class="kyrolll-btn" href="' + mail + '" target="_blank">OPEN EMAIL WITH YOUR ID</a><p style="font-family:ui-monospace,monospace;font-size:10px;margin-top:10px;word-break:break-all;color:#888;">ID: ' + user.id + '</p>';
          if(link){ link.href = mail; }
        } else {
          body.innerHTML = '<span class="library-empty__title">SIGN IN TO ACCESS SUPPORT</span><p>Log in so we can include your permanent user ID automatically.</p><a class="kyrolll-btn" href="auth.html?next=support">LOG IN / SIGN UP →</a>';
          if(link){ link.href = "auth.html?next=support"; }
        }
      }
    })();
  </script>
</body>
</html>
