# Base44 dev environment for the KYROlll store.
#
# Static storefront running straight from cloned source via server.mjs on port 3000.
name: kyrolll-store

services:
  web:
    image: node:22
    working_dir: /app
    command: ["node", "server.mjs"]
    volumes:
      - .:/app
    ports:
      - "3000:8080"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
