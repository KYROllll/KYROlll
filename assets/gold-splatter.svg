<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset="0.22" stop-color="#ffe27a"/>
      <stop offset="0.48" stop-color="#e7b83c"/>
      <stop offset="0.72" stop-color="#c58e20"/>
      <stop offset="0.9" stop-color="#946512"/>
      <stop offset="1" stop-color="#6b470c"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.45" stop-color="#ffd95e"/>
      <stop offset="1" stop-color="#c08a1c"/>
    </linearGradient>
    <radialGradient id="goldHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4ca45" stop-opacity="0.34"/>
      <stop offset="0.62" stop-color="#d7a62a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d7a62a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- A soft metallic bloom keeps the splash reading as liquid gold on the black disc. -->
  <ellipse cx="655" cy="350" rx="150" ry="190" fill="url(#goldHalo)"/>

