# Supabase CLI project config for KYROlll.
#
# Only the two payment functions are pinned here; everything else uses the CLI
# defaults. `supabase functions deploy` reads these flags.

project_id = "kyroll-store"

# The store has no accounts, so there is no Supabase JWT for the browser to
# present. Both functions are public: `create-payment` prices the order
# server-side and never trusts a client-supplied price, and the webhook
# authenticates itself with the `x-nowpayments-sig` HMAC.
[functions.create-payment]
verify_jwt = false

# NOWPayments cannot present a Supabase token, so the IPN callback MUST be
# deployed without JWT verification — otherwise every callback is rejected at
# the gateway with 401 before the signature check ever runs.
[functions.nowpayments-webhook]
verify_jwt = false
